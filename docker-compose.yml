services:
  server:
    image: ghcr.io/dyyz1993/docker-container-shanbox:latest
    container_name: shanbox
    restart: unless-stopped
    ports:
      - "2222:22"
      - "9080:80"
    environment:
      - SSH_PUBLIC_KEY=${SSH_PUBLIC_KEY}
      - PUBLIC_IP=${PUBLIC_IP}
      - DOMAIN=${DOMAIN:-example.com}
    volumes:
      - ./config:/etc/nginx/custom
      - ./scripts:/root/scripts
      - ./data:/root/data
      - ./logs:/var/log
    env_file:
      - .env
