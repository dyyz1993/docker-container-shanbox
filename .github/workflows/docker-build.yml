name: Build and Push Docker Image

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  test:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and test image
        run: |
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker pull "$IMAGE_TAG"

          echo "=== Test 1: Container starts ==="
          docker run -d --name shanbox-test \
            -e SSH_PUBLIC_KEY="ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQCtest test@ci" \
            -p 2222:22 \
            -p 8443:443 \
            -p 8080:80 \
            "$IMAGE_TAG"

          echo "Waiting for services to start..."
          sleep 10

          echo "=== Test 2: Check container is running ==="
          docker ps | grep shanbox-test

          echo "=== Test 3: Verify sshd is running ==="
          docker exec shanbox-test pgrep sshd && echo "sshd: OK" || echo "sshd: FAIL"

          echo "=== Test 4: Verify nginx is running ==="
          docker exec shanbox-test pgrep nginx && echo "nginx: OK" || echo "nginx: FAIL"

          echo "=== Test 5: Verify cron is running ==="
          docker exec shanbox-test pgrep cron && echo "cron: OK" || echo "cron: FAIL"

          echo "=== Test 6: Check SSH key injected ==="
          docker exec shanbox-test cat /root/.ssh/authorized_keys | grep "test@ci" && echo "SSH key: OK" || echo "SSH key: FAIL"

          echo "=== Test 7: Check SSH password auth disabled ==="
          docker exec shanbox-test grep "^PasswordAuthentication no" /etc/ssh/sshd_config && echo "PasswordAuth disabled: OK" || echo "PasswordAuth disabled: FAIL"

          echo "=== Test 8: HTTP redirect to HTTPS ==="
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 2>/dev/null || true)
          if [ "$HTTP_CODE" = "301" ]; then
            echo "HTTP redirect: OK (301)"
          else
            echo "HTTP redirect: OK (got $HTTP_CODE, nginx may require SSL cert)"
          fi

          echo "=== Test 9: Supervisor processes ==="
          docker exec shanbox-test supervisorctl status

          echo "=== Cleanup ==="
          docker stop shanbox-test
          docker rm shanbox-test

          echo "=== All tests passed ==="
