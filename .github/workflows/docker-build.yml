name: Build and Push Docker Image

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  test:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and test image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker pull "$IMAGE"
          echo "=== Test 1: Container starts ==="
          docker run -d --name testbox \
            -e SSH_PUBLIC_KEY="ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQCtest test@ci" \
            -p 2222:22 -p 8443:443 -p 8080:80 \
            "$IMAGE"
          sleep 8

          echo "=== Test 2: Container running ==="
          docker ps | grep testbox

          echo "=== Test 3: sshd ==="
          docker exec testbox pgrep sshd && echo "sshd: OK"

          echo "=== Test 4: nginx ==="
          docker exec testbox pgrep nginx && echo "nginx: OK"

          echo "=== Test 5: cron ==="
          docker exec testbox pgrep cron && echo "cron: OK"

          echo "=== Test 6: SSH key ==="
          docker exec testbox cat /root/.ssh/authorized_keys | grep "test@ci" && echo "SSH key: OK"

          echo "=== Test 7: Password auth disabled ==="
          docker exec testbox grep "^PasswordAuthentication no" /etc/ssh/sshd_config && echo "PasswordAuth: OK"

          echo "=== Test 8: Self-signed SSL ==="
          docker exec testbox test -f /etc/nginx/ssl/cert.pem && echo "SSL cert: OK"
          docker exec testbox test -f /etc/nginx/ssl/key.pem && echo "SSL key: OK"

          echo "=== Test 9: Supervisor ==="
          docker exec testbox supervisorctl status

          echo "=== Test 10: Nginx config test ==="
          docker exec testbox nginx -t

          echo "=== Cleanup ==="
          docker stop testbox && docker rm testbox

          echo "=== ALL TESTS PASSED ==="
