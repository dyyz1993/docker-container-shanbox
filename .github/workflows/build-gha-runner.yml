name: Build GitHub Runner Image

# 构建带全工具链的自托管 runner 镜像推到 GHCR，供极空间 NAS 拉取
# 触发：github-runner/ 有改动、手动、每月 1 号自动跟进最新 runner 版本
on:
  push:
    branches: [master]
    paths:
      - "github-runner/**"
      - ".github/workflows/build-gha-runner.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/gha-runner

jobs:
  build:
    runs-on: ubuntu-latest # 用托管 runner 的免费额度构建镜像（每月一次约 30 分钟）
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve latest runner version
        id: runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "version=$(gh api repos/actions/runner/releases/latest --jq '.tag_name' | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: github-runner
          platforms: linux/amd64 # 极空间 Z4Pro x86_64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:runner-${{ steps.runner.outputs.version }}
          build-args: |
            RUNNER_VERSION=${{ steps.runner.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
