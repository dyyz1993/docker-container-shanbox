# ============================================================
# routes.conf - Domain to Port Mapping
# ============================================================
# This file is volume-mounted into the container.
# Edit it to add/remove services.
#
# Format: Nginx map directives
#   ~^[prefix]\.  matches subdomains starting with [prefix]
#
# Access Policies:
#   public   - No authentication required
#   key      - Requires ?key=xxx query parameter
#   header   - Requires X-Auth-Token header
#   private  - Only accessible from LAN or same public IP
# ============================================================

map $host $backend_port {
    default              0;
    # ~^api\.            3000;
    # ~^web\.            3001;
    # ~^hello\.          9000;
}

map $host $access_policy {
    default              "public";
    # ~^api\.            "key";
    # ~^web\.            "public";
    # ~^tools\.          "header";
    # ~^admin\.          "private";
}
