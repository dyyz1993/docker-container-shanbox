name: gha

# 极空间 NAS 上只拉取、不构建：镜像统一由 CI 构建推 GHCR（.github/workflows/build-gha-runner.yml）
# 本地 Mac 调试需要自建镜像时：docker build -t gha-runner:local .
services:
  runner:
    image: ${RUNNER_IMAGE:-ghcr.io/dyyz1993/gha-runner:latest}
    hostname: gha-runner # 固定主机名：GitHub 侧 runner 名稳定，重建容器后 --replace 能清理旧注册
    restart: unless-stopped
    privileged: true # 内嵌 dockerd（dind）需要；与 NAS 宿主 Docker 完全隔离
    init: true
    tmpfs:
      - /var/run # 每次启动给干净的运行目录：避免残留 docker.pid 导致 dockerd 拒启
    # 用 bash 显式执行：下方只读挂载会带宿主文件的 mode（可能没有 +x），不能依赖 exec 权限位。
    entrypoint: ["sh","-c","mkdir -p /run/sshd && exec bash /usr/local/bin/entrypoint.sh"]
    ports:
      - "${SSH_PORT:-2202}:22" # SSH 调试入口（仅密钥）
    env_file:
      - ${ENV_FILE:-.env} # 多实例：由 --env-file 传入的 ENV_FILE 指定各自配置（变量替换与容器 env 是两回事）
    volumes:
      - gradle-cache:/home/runner/.gradle
      - maven-cache:/home/runner/.m2
      - npm-cache:/home/runner/.npm
      - pub-cache:/home/runner/.pub-cache
      - uv-cache:/home/runner/.cache/uv
      - go-mod-cache:/home/runner/go
      - go-build-cache:/home/runner/.cache/go-build
      - dind-data:/var/lib/docker # dind 镜像缓存，重启不丢
      - playwright-cache:/home/runner/.cache/ms-playwright # 浏览器按版本缓存，每个版本只下一次
      - /data/docker/cache/chromium:/opt/nas-chrome:ro # 复用 NAS 现成 Chrome（CI 里可用 channel:"chrome"/executablePath 直取）
      - pnpm-store:/home/runner/.local/share/pnpm # pnpm 包存储跨 job 复用
      - tools:/opt/tools # 外挂卷：Android SDK + Flutter 懒加载，跨镜像更新存活（两实例共享一份）
      # entrypoint 只读挂载：宿主改 entrypoint 后 `compose up -d` 即生效，不必等镜像重建。
      # 镜像内仍是同一份（Dockerfile COPY），这里只是让热修路径与镜像真相源保持同一文件。
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    # 不映射任何端口：runner 是出站长轮询连 GitHub，NAS 在内网即可

volumes:
  gradle-cache:
  maven-cache:
  npm-cache:
  pub-cache:
  uv-cache:
  go-mod-cache:
  go-build-cache:
  dind-data:
  playwright-cache:
  pnpm-store:
  tools:
    external: true
    name: gha-tools
