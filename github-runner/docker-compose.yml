name: gha

# 极空间 NAS 上只拉取、不构建：镜像统一由 CI 构建推 GHCR（.github/workflows/build-gha-runner.yml）
# 本地 Mac 调试需要自建镜像时：docker build -t gha-runner:local .
services:
  runner:
    image: ${RUNNER_IMAGE:-ghcr.io/dyyz1993/gha-runner:latest}
    hostname: gha-runner # 固定主机名：GitHub 侧 runner 名稳定，重建容器后 --replace 能清理旧注册
    restart: unless-stopped
    privileged: true # 内嵌 dockerd（dind）需要；与 NAS 宿主 Docker 完全隔离
    init: true
    ports:
      - "${SSH_PORT:-2202}:22" # SSH 调试入口（仅密钥）
    env_file:
      - .env
    volumes:
      - gradle-cache:/home/runner/.gradle
      - maven-cache:/home/runner/.m2
      - npm-cache:/home/runner/.npm
      - pub-cache:/home/runner/.pub-cache
      - uv-cache:/home/runner/.cache/uv
      - go-mod-cache:/home/runner/go
      - go-build-cache:/home/runner/.cache/go-build
      - dind-data:/var/lib/docker # dind 镜像缓存，重启不丢
    # 不映射任何端口：runner 是出站长轮询连 GitHub，NAS 在内网即可

volumes:
  gradle-cache:
  maven-cache:
  npm-cache:
  pub-cache:
  uv-cache:
  go-mod-cache:
  go-build-cache:
  dind-data:
