geo $is_local {
    default 0;
    10.0.0.0/8     1;
    192.168.0.0/16 1;
    127.0.0.0/8    1;
    10.99.0.0/24   0;
}

map $http_x_real_ip $is_real_local {
    default 0;
    ~^10\.           1;
    ~^192\.168\.     1;
    ~^127\.          1;
}

map $host $lan_only {
    default 0;
}

map $host $backend_host {
    default "";
}

map $host$arg_key $key_valid {
    default 0;
}
