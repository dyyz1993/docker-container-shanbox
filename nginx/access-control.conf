map $host $access_policy {
    default         "public";
    ~^api\.         "key";
    ~^tools\.       "header";
    ~^admin\.       "private";
}

map $remote_addr $is_local {
    default                          0;
    ~^10\.                           1;
    ~^172\.(1[6-9]|2[0-9]|3[01])\.   1;
    ~^192\.168\.                     1;
    "127.0.0.1"                      1;
}

map $host $backend_port {
    default              0;
    ~^api\.              3000;
    ~^web\.              3001;
    ~^tools\.            3002;
    ~^docs\.             8080;
}

map $host $backend_type {
    default              "";
    ~^api\.              "proxy";
    ~^web\.              "proxy";
    ~^tools\.            "proxy";
    ~^docs\.             "static";
}
