<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Authentication Required</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #f0f2f5;
  display: flex; justify-content: center; align-items: center; min-height: 100vh;
}
.card {
  background: #fff; border-radius: 12px; padding: 40px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08); max-width: 420px; width: 100%;
}
h2 { font-size: 20px; color: #1a1a2e; margin-bottom: 8px; }
.sub { font-size: 14px; color: #6b7280; margin-bottom: 24px; }
label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
input, select {
  width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px;
  font-size: 14px; margin-bottom: 16px; outline: none; transition: border-color .2s;
}
input:focus, select:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
.btn {
  width: 100%; padding: 10px; background: #2563eb; color: #fff; border: none;
  border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;
  transition: background .2s;
}
.btn:hover { background: #1d4ed8; }
.info { margin-top: 20px; padding: 12px; background: #f8fafc; border-radius: 8px; font-size: 12px; color: #64748b; }
.info code { background: #e2e8f0; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<div class="card">
  <h2>Authentication Required</h2>
  <p class="sub">This resource requires authentication to access.</p>

  <form id="auth-form">
    <label for="method">Auth Method</label>
    <select id="method">
      <option value="key">Query Parameter (key)</option>
      <option value="header">Auth Header (X-Auth-Token)</option>
    </select>

    <label for="credential">Credential</label>
    <input id="credential" type="text" placeholder="Enter access key or token..." autofocus />

    <button type="submit" class="btn">Submit</button>
  </form>

  <div class="info" id="info">
    <div>Source IP: <code id="source-ip">-</code></div>
    <div>Redirect: <code id="redirect-url">-</code></div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const from = params.get('from') || '/';

document.getElementById('redirect-url').textContent = decodeURIComponent(from);

fetch('https://api.ipify.org?format=json', { signal: AbortSignal.timeout(3000) })
  .then(r => r.json())
  .then(d => { document.getElementById('source-ip').textContent = d.ip; })
  .catch(() => { document.getElementById('source-ip').textContent = 'unavailable'; });

document.getElementById('auth-form').onsubmit = function(e) {
  e.preventDefault();
  const method = document.getElementById('method').value;
  const credential = document.getElementById('credential').value.trim();
  if (!credential) return;

  let targetUrl;
  try {
    targetUrl = new URL(from, location.origin);
  } catch {
    targetUrl = new URL(from);
  }

  if (method === 'key') {
    targetUrl.searchParams.set('key', credential);
  }

  if (method === 'header') {
    location.href = targetUrl.toString();
    return;
  }

  location.href = targetUrl.toString();
};
</script>
</body>
</html>
